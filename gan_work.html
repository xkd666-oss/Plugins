<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小甘图像控制与提示词一体化工作台</title>
<style>
:root {
    --bg-color: #000000;
    --card-bg: rgba(28, 28, 30, 0.75);
    --card-border: rgba(255, 255, 255, 0.12);
    --accent-color: #0A84FF;
    --accent-hover: #409CFF;
    --lock-color: #FF3B30;
    --transfer-color: #AF52DE;
    --text-primary: #FFFFFF;
    --text-secondary: #8E8E93;
    --tag-bg: rgba(120, 120, 128, 0.18);
    --blur-val: blur(20px);
    --role-base: #0A84FF;
    --role-object: #AF52DE;
    --role-style: #FF2D55;
    --role-structure: #FF9F0A;
    --role-depth: #5AC8FA;
    --role-lineart: #30D158;
}
* { box-sizing: border-box; margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body { background-color: var(--bg-color); color: var(--text-primary);
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 16px 12px 240px 12px; }
.container { width: 100%; max-width: 1600px; display: flex; flex-direction: column; gap: 16px; }
header { text-align: center; padding: 4px 0; }
header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 4px; }
header p { color: var(--text-secondary); font-size: 12px; }
.glass-card { background: var(--card-bg); backdrop-filter: var(--blur-val);
    -webkit-backdrop-filter: var(--blur-val); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 16px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
.section-title { font-size: 15px; font-weight: 600; color: var(--text-primary);
    margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.section-title-left { display: flex; align-items: center; gap: 8px; }
.section-title-left::before { content: ''; display: inline-block; width: 4px; height: 14px;
    background: var(--accent-color); border-radius: 2px; }
.workspace-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
@media (max-width: 1024px) { .workspace-grid { grid-template-columns: 1fr; } }
.canvas-block { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.canvas-container { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 60vh;
    background: #121214; border: 1px solid var(--card-border); border-radius: 12px;
    overflow: hidden; touch-action: none; cursor: default; }
.canvas-container.panning { cursor: grabbing; }
.canvas-stage { position: absolute; inset: 0; transform-origin: center center;
    transition: transform 0.12s linear; will-change: transform; }
.canvas-stage.no-transition { transition: none; }
.canvas-stage canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
#baseCanvas { z-index: 1; }
#maskCanvas { z-index: 2; }
#tempCanvas { z-index: 3; pointer-events: none; }
.annotation-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; overflow: visible; }
.annotation-item { position: absolute; pointer-events: auto; transform-origin: 0 0;
    display: flex; align-items: flex-start; gap: 0; user-select: none; }
.annotation-pin { width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    border: 2px solid rgba(255,255,255,0.85);
    cursor: grab; flex-shrink: 0; transition: transform 0.12s; }
.annotation-pin:active { cursor: grabbing; transform: scale(1.15); }
.annotation-card { margin-left: 6px; background: rgba(20,20,22,0.92);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 8px;
    padding: 6px 8px; font-size: 11px; line-height: 1.4;
    max-width: 220px; box-shadow: 0 4px 16px rgba(0,0,0,0.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.annotation-card .anno-src { color: #E5E5EA; }
.annotation-card .anno-arrow { color: var(--text-secondary); margin: 0 3px; }
.annotation-card .anno-tgt { color: #30D158; font-weight: 600; }
.annotation-card .anno-actions { margin-top: 4px; display: flex; gap: 4px; }
.annotation-card .anno-actions button {
    background: rgba(120,120,128,0.25); color: #fff; border: 1px solid var(--card-border);
    border-radius: 5px; font-size: 10px; padding: 2px 6px; cursor: pointer; }
.annotation-card .anno-actions button.del { color: #FF3B30; border-color: rgba(255,59,48,0.4); }
.annotation-item.hidden { display: none; }
.annotation-item.editing .annotation-card { border-color: var(--accent-color); }

.anno-modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 12000;
    display: none; align-items: center; justify-content: center; padding: 16px; }
.anno-modal-mask.active { display: flex; }
.anno-modal { width: min(420px, 100%); background: rgba(28,28,30,0.98);
    border: 1px solid var(--card-border); border-radius: 14px; padding: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7); display: flex; flex-direction: column; gap: 12px; }
.anno-modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.anno-modal .field-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.anno-modal input, .anno-modal textarea {
    width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--card-border);
    border-radius: 8px; padding: 8px 10px; color: #fff; font-size: 13px; outline: none; resize: vertical; }
.anno-color-row { display: flex; gap: 8px; flex-wrap: wrap; }
.anno-color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: transform 0.12s; }
.anno-color-dot.active { border-color: #fff; transform: scale(1.15); }
.anno-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

.canvas-toolbar { display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,0.3);
    padding: 8px 10px; border-radius: 10px; border: 1px solid var(--card-border); flex-wrap: wrap; }
.tool-btn { background: var(--tag-bg); border: 1px solid transparent; color: #FFF;
    padding: 8px 12px; min-height: 36px; border-radius: 8px; font-size: 13px; cursor: pointer;
    transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; }
.tool-btn.active { background: var(--accent-color); }
.zoom-label { font-size:12px; color:var(--text-secondary); align-self:center; min-width:42px; text-align:center; }
.image-control-modifiers { display: flex; flex-direction: column; gap: 16px; }
.control-group-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
.tags-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-btn { background: var(--tag-bg); border: 1px solid transparent; color: #E5E5EA;
    padding: 8px 12px; min-height: 34px; border-radius: 17px; font-size: 12px; cursor: pointer;
    transition: all 0.15s ease; user-select: none; display: inline-flex; align-items: center; }
.tag-btn.active { background: var(--accent-color); color: #FFFFFF; }
.tag-btn.lock-tag.active { background: var(--lock-color) !important; }
.tag-btn.transfer-tag.active { background: var(--transfer-color) !important; }
.ref-gallery { display: flex; gap: 10px; flex-wrap: nowrap; overflow-x: auto;
    padding-bottom: 6px; max-height: none; }
.ref-item { position: relative; min-width: 110px; width: 110px; border-radius: 8px;
    overflow: hidden; border: 2px solid var(--card-border); cursor: pointer; background: #000;
    display: flex; flex-direction: column; flex-shrink: 0; }
.ref-item.active { border-color: var(--accent-color); box-shadow: 0 0 8px rgba(10, 132, 255, 0.6); }
.ref-item img { width: 100%; height: 70px; object-fit: cover; }
.ref-item select { width: 100%; background: #1C1C1E; color: #FFF; font-size: 10px;
    border: none; padding: 4px 2px; outline: none; }
.ref-item .layer-tag { font-size: 10px; text-align: center; padding: 2px 0;
    color: #30D158; font-weight: bold; background: rgba(0, 0, 0, 0.7); }
.ref-item .remove-btn { position: absolute; top: 2px; right: 2px; background: rgba(0, 0, 0, 0.7);
    color: #FF3B30; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; }
.ref-item .order-badge {
    position: absolute; top: 2px; left: 2px; z-index: 2;
    background: rgba(0,0,0,0.78); color: #fff; font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 10px; display: flex; align-items: center; gap: 4px;
    border: 1px solid rgba(255,255,255,0.18); pointer-events: none; }
.ref-item .order-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #8E8E93; }
.ref-item .role-strip { height: 3px; width: 100%; background: #8E8E93; }
.ref-item .anno-count {
    position: absolute; bottom: 26px; right: 2px;
    background: rgba(255,159,10,0.9); color: #000; font-size: 10px; font-weight: 700;
    padding: 1px 5px; border-radius: 8px; }
.ref-gallery-hint {
    font-size: 11px; color: var(--text-secondary); margin: 2px 0 4px 0;
    display: flex; align-items: center; gap: 6px; }
.ref-gallery-hint b { color: #fff; }
.file-btn { background: rgba(120, 120, 128, 0.2); border: 1px solid var(--card-border);
    color: #FFF; padding: 10px 14px; min-height: 40px; border-radius: 8px; font-size: 13px;
    cursor: pointer; text-align: center; display: inline-flex; align-items: center; justify-content: center; }
.file-btn input { display: none; }
.custom-input, .text-area-input { width: 100%; background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px;
    color: #FFFFFF; font-size: 13px; outline: none; }
.floating-output { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 24px); max-width: 1600px; z-index: 999;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.floating-output.collapsed { transform: translateX(-50%) translateY(calc(100% - 48px)); }
.output-box { width: 100%; height: 140px; background: rgba(0, 0, 0, 0.65);
    border: 1px solid var(--card-border); border-radius: 10px; padding: 10px;
    color: #E5E5EA; font-size: 12px; font-family: monospace; resize: none;
    outline: none; line-height: 1.5; }
.action-bar { display: flex; justify-content: space-between; align-items: center;
    margin-top: 8px; flex-wrap: wrap; gap: 8px; }
.btn { background: var(--accent-color); color: #FFFFFF; border: none; padding: 8px 16px;
    min-height: 38px; border-radius: 10px; font-size: 13px; font-weight: 500;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.btn-secondary { background: rgba(120, 120, 128, 0.25); }
.btn-danger { background: rgba(255, 59, 48, 0.25); color: #FF3B30;
    border: 1px solid rgba(255, 59, 48, 0.4); }
.toast { position: fixed; bottom: 220px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(52, 199, 89, 0.95); color: #FFF; padding: 8px 18px; border-radius: 20px;
    font-size: 13px; opacity: 0; visibility: hidden; transition: all 0.3s ease;
    pointer-events: none; z-index: 10000; }
.toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
.main-category-title { display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; font-weight: 600; font-size: 14px; padding: 4px 0; }
.glass-card.collapsed .category-content { display: none; }
.glass-card.collapsed .main-category-title span:last-child { transform: rotate(180deg); }
.converter-panel { display: none; flex-direction: column; gap: 12px; margin-top: 10px;
    padding-top: 12px; border-top: 1px dashed var(--card-border); }
.converter-panel.active { display: flex; }
.input-row { display: flex; gap: 10px; flex-wrap: wrap; }
.input-row input { flex: 1; min-width: 140px; }
.workflow-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.workflow-bar select{background:#2c2c2e;color:#fff;border:1px solid var(--card-border);border-radius:8px;padding:7px}
.status-row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.status-pill{padding:4px 8px;border-radius:99px;background:rgba(120,120,128,.15);font-size:11px}
.status-pill.ok{color:#34C759}
.status-pill.warn{color:#FF9F0A}
.layer-actions{display:flex;gap:4px;margin-top:4px}
.layer-actions button{flex:1;min-height:25px;background:rgba(120,120,128,.15);color:#fff;border:1px solid var(--card-border);border-radius:6px;font-size:11px}

/* ===== 独立画布编辑页 ===== */
.canvas-editor-page { position: fixed; inset: 0; z-index: 5000; display: none;
    flex-direction: column; background: #080809; color: #fff; overflow: hidden; }
.canvas-editor-page.active { display: flex; }
body.canvas-editor-open { overflow: hidden; padding-bottom: 0; }
.editor-topbar { height: 52px; min-height: 52px; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; padding: 8px 12px;
    background: rgba(18,18,20,.96); border-bottom: 1px solid var(--card-border);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.editor-title { display: flex; align-items: center; gap: 8px; min-width: 0;
    font-size: 14px; font-weight: 600; }
.editor-title small { color: var(--text-secondary); font-size: 10px; font-weight: 400; }
.editor-top-actions { display:flex; gap:6px; }
.editor-top-actions .btn { min-height: 34px; padding: 5px 10px; font-size: 12px; }
.editor-stage { flex: 1; min-height: 0; display: flex; align-items: center;
    justify-content: center; padding: 12px; overflow: hidden; }
.editor-stage .canvas-block { width: min(100%, 1200px); height: 100%; justify-content: center; }
.editor-stage .canvas-container { width: 100%; height: 100%; aspect-ratio: auto;
    max-height: none; flex: 1 1 auto; }
.editor-toolbar-wrap { flex: 0 0 auto; padding: 8px 12px 12px;
    background: rgba(18,18,20,.97); border-top: 1px solid var(--card-border);
    box-shadow: 0 -12px 35px rgba(0,0,0,.35); }
.editor-toolbar-wrap .canvas-toolbar { max-width: 1200px; margin-left: auto; margin-right: auto;
    background: transparent; border: 0; padding: 0; }
.canvas-entry-card { display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px; border: 1px solid var(--card-border);
    border-radius: 12px; background: rgba(0,0,0,.22); }
.canvas-entry-info { min-width: 0; }
.canvas-entry-info b { display:block; font-size:13px; margin-bottom:3px; }
.canvas-entry-info span { color:var(--text-secondary); font-size:11px; }
.editor-open-btn { white-space: nowrap; }

/* ===== 隐藏式更多菜单 ===== */
.more-menu-wrap {
    position: relative;
    display: inline-block;
}
.more-menu-trigger {
    background: rgba(120,120,128,0.22);
    border: 1px solid var(--card-border);
    min-height: 36px;
}
.more-menu-trigger.open {
    background: var(--accent-color);
}
.more-menu-trigger .caret {
    margin-left: 4px;
    font-size: 10px;
    transition: transform 0.2s;
}
.more-menu-trigger.open .caret {
    transform: rotate(180deg);
}
.more-menu-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 1500;
    min-width: 260px;
    max-width: calc(100vw - 24px);
    background: rgba(28,28,30,0.98);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: none;
    flex-direction: column;
    gap: 12px;
    animation: menuFadeIn 0.15s ease;
}
.more-menu-panel.open {
    display: flex;
}
@keyframes menuFadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
}
.more-menu-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.more-menu-label {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 600;
    letter-spacing: 0.3px;
}
.more-menu-items {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
}
.more-menu-items .tool-btn {
    min-height: 32px;
    padding: 5px 10px;
    font-size: 12px;
}
.more-menu-items .zoom-label,
.more-menu-items .view-status-label {
    font-size: 11px;
    color: var(--text-secondary);
    align-self: center;
    min-width: 42px;
    text-align: center;
    padding: 0 4px;
}

@media (max-width: 600px) {
    .editor-topbar { height:48px; min-height:48px; padding:6px 8px; }
    .editor-stage { padding:6px; }
    .editor-stage .canvas-container { height:100%; min-height:0; border-radius:10px; }
    .editor-toolbar-wrap { padding:7px 7px calc(7px + env(safe-area-inset-bottom)); }
    .editor-toolbar-wrap .canvas-toolbar { overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none; }
    .editor-toolbar-wrap .canvas-toolbar::-webkit-scrollbar { display:none; }
    .editor-toolbar-wrap .tool-btn { flex:0 0 auto; min-height:34px; padding:6px 9px; }
    .canvas-entry-card { padding:10px; }
    .canvas-entry-info span { display:block; max-width:220px; line-height:1.35; }
    body { padding: 6px 6px 180px 6px; }
    .container { gap: 8px; }
    header { display: none; }
    .glass-card { padding: 8px; border-radius: 12px; }
    .section-title { margin-bottom: 6px; font-size: 13px; }
    .section-title-left::before { width: 3px; height: 12px; }
    .workflow-bar { gap: 5px; margin-bottom: 5px; }
    .workflow-bar b { font-size: 12px; }
    .workflow-bar select { flex: 1; min-width: 0; padding: 6px; }
    .workflow-bar .btn { min-height: 30px; padding: 5px 8px; }
    .status-row { margin: 3px 0 5px; }
    .status-pill { padding: 3px 6px; font-size: 10px; }
    .workspace-grid { gap: 8px; }
    .canvas-block { gap: 6px; }
    .canvas-container { aspect-ratio: auto; height: min(62svh, calc(100svh - 190px));
        min-height: 260px; max-height: none; }
    .canvas-toolbar { justify-content: flex-start; padding: 6px; gap: 5px; }
    .tool-btn { min-height: 32px; padding: 6px 8px; font-size: 12px; }
    #brushSizeContainer { width: 100%; margin-left: 0 !important; margin-top: 2px; }
    #brushSize { flex: 1; }
    .action-bar { flex-direction: column; align-items: stretch; }
    .action-bar > div { display: flex; width: 100%; gap: 6px; flex-wrap: wrap; }
    .action-bar > div > button { flex: 1; }
    .annotation-card { max-width: 160px; font-size: 10px; }

    /* 移动端：更多菜单从底部弹出 */
    .more-menu-panel {
        position: fixed;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        min-width: 0;
        max-width: none;
        border-radius: 16px 16px 0 0;
        padding: 16px 14px calc(16px + env(safe-area-inset-bottom));
        max-height: 70vh;
        overflow-y: auto;
        animation: menuSlideUp 0.2s ease;
    }
    @keyframes menuSlideUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .more-menu-items .tool-btn {
        flex: 1 1 auto;
        min-width: 72px;
    }
}
@media (max-width: 600px) and (orientation: landscape) {
    .canvas-container { height: min(62svh, 420px); min-height: 180px; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>小甘 图像控制与提示词一体化工作台</h1>
        <p>万物迁移 · 精准锁定修饰 · 黑白通道蒙版 · 画布标注 · 显式 AI 控制体系</p>
    </header>

    <div class="glass-card">
        <div class="section-title">
            <div class="section-title-left">🖼️ 图像控制与蒙版绘制工作台</div>
            <button class="btn btn-secondary" style="font-size:12px; padding:4px 10px; min-height:28px;" onclick="openCanvasEditor()">🖌️ 进入编辑页</button>
        </div>

        <div class="workflow-bar">
            <b>🎯 工作流</b>
            <select id="workflowMode" onchange="applyWorkflowMode(this.value)">
                <option value="custom">自定义控制</option>
                <option value="transfer">万物迁移</option>
                <option value="inpaint">局部修改</option>
                <option value="material">材质替换</option>
                <option value="style">风格迁移</option>
                <option value="environment">环境替换</option>
            </select>
            <button class="btn btn-secondary" onclick="saveProject()">💾 保存</button>
            <button class="btn btn-secondary" onclick="loadProject()">📂 加载</button>
        </div>
        <div class="status-row" id="workflowStatus"></div>

        <div class="workspace-grid">
            <div class="canvas-entry-card">
                <div class="canvas-entry-info">
                    <b>🖼️ 画布编辑器</b>
                    <span>画布、蒙版、套索、多边形、橡皮擦、旋转/翻转/缩放/平移、<b style="color:#FF9F0A;">打标签</b> 已独立到全屏编辑页。</span>
                </div>
                <button class="btn editor-open-btn" onclick="openCanvasEditor()">🖌️ 打开画布编辑</button>
            </div>

            <div class="image-control-modifiers">
                <div class="control-group-title">🔒 图像控制与锁图修饰符</div>
